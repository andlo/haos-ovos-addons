name: "OVOS Wyoming STT"
version: "0.0.1"
slug: "ovos_wyoming_stt"
description: "Expose an OVOS speech-to-text plugin via Wyoming for use in Assist pipelines"
url: "https://github.com/andlo/haos-ovos-addons/tree/master/ovos-wyoming-stt"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ports:
  10300/tcp: 10300
ports_description:
  10300/tcp: "Wyoming protocol port"
discovery:
  - wyoming
options:
  plugin: "ovos-stt-plugin-server"
  plugin_config: "{}"
  extra_pip_packages: ""
  log_level: "info"
schema:
  plugin: "str"
  plugin_config: "str"
  extra_pip_packages: "str"
  log_level: "list(debug|info|warning|error)"
