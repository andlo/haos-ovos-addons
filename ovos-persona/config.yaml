name: "OVOS Persona"
version: "0.0.4"
slug: "ovos_persona"
description: "Ollama-compatible OVOS persona server, usable as a Home Assistant conversation agent"
url: "https://github.com/andlo/haos-ovos-addons/tree/master/ovos-persona"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
ports:
  8337/tcp: 8337
ports_description:
  8337/tcp: "Ollama/OpenAI-compatible API port"
options:
  solvers:
    - "ovos-solver-plugin-ddg"
    - "ovos-solver-failure-plugin"
  solver_config: "{}"
  extra_pip_packages: ""
  log_level: "info"
schema:
  solvers: ["str"]
  solver_config: "str"
  extra_pip_packages: "str"
  log_level: "list(debug|info|warning|error)"
