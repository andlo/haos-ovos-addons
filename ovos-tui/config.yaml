name: "OVOS TUI"
version: "0.0.2"
slug: "ovos_tui"
description: "andlo/ovos-tui-client running in --web mode: type utterances, watch the conversation and activity feed, without a mic/speaker"
url: "https://github.com/andlo/haos-ovos-addons/tree/master/ovos-tui"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: manual
map:
  - share:rw
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: "Web UI -- open http://<hostname>:8000/ in a browser"
options: {}
schema: {}
