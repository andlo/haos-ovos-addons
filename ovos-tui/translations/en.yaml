configuration:
  web_public_url:
    name: "Web public URL"
    description: "Set this if the terminal page loads but stays blank/unstyled and never connects. Example: http://192.168.1.50:8000 -- the address your OWN browser uses to reach this add-on (your Home Assistant host's LAN IP, with the same port shown in this add-on's Network settings). Leave blank to try this add-on's own hostname first, which works automatically on networks that support mDNS."
