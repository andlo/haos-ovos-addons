configuration:
  web_host:
    name: "Web host"
    description: "Advanced/optional. Defaults to this add-on's own Docker hostname (reachable via mDNS/.local.hass.io on networks that support it) -- this only needs changing if that doesn't resolve for you AND you have another address this add-on's own container can genuinely bind to. Setting this to your Home Assistant host's real LAN IP will crash the add-on outright (a container can't bind to an address it doesn't own) unless it's running in host networking mode, which this add-on deliberately isn't."
