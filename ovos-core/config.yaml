name: "OVOS Core"
version: "0.0.16"
slug: "ovos_core"
description: "OVOS skill runtime — loads installed skills and answers questions via a synchronous HTTP endpoint, usable as a Home Assistant conversation agent"
url: "https://github.com/andlo/haos-ovos-addons/tree/master/ovos-core"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
map:
  - share:rw
ports:
  8181/tcp: 8181
  8500/tcp: null
ports_description:
  8181/tcp: "Shared ovos-messagebus — reachable by other OVOS add-ons on Supervisor's internal network, not the host LAN"
  8500/tcp: "Synchronous question/answer HTTP API for Home Assistant's conversation-agent integration"
options:
  extra_pip_packages: ""
  log_level: "info"
schema:
  extra_pip_packages: "str"
  log_level: "list(debug|info|warning|error)"
