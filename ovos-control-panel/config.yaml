name: "OVOS Control Panel"
version: "0.0.1"
slug: "ovos_control_panel"
description: "Unified OVOS web UI (settings, skills, plugins, personas, translate, backup) -- OpenVoiceOS/ovos-control-panel, unmodified"
url: "https://github.com/andlo/haos-ovos-addons/tree/master/ovos-control-panel"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: manual
map:
  - share:rw
ports:
  8500/tcp: 8510
ports_description:
  8500/tcp: "Web UI -- open http://<hostname>:8510/ in a browser"
options:
  token: "changeme"
schema:
  token: "password"
