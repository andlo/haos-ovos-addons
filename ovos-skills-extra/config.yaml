name: "OVOS Skills Extra"
version: "0.0.1"
slug: "ovos_skills_extra"
description: "Install ANY OVOS-compatible skill from PyPI or a git URL -- unverified, unrestricted, your own responsibility"
url: "https://github.com/andlo/haos-ovos-addons/tree/master/ovos-skills-extra"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
map:
  - share:rw
ports:
  8502/tcp: 8502
ports_description:
  8502/tcp: "HTTP API port"
options:
  log_level: "info"
schema:
  log_level: "list(debug|info|warning|error)"
